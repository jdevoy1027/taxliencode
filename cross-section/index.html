<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borehole Cross-Section — Geonomics</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<style id="pagecss">@page{size:11in 8.5in;margin:1in 1in .35in 1in}</style>
<style>
  :root{
    --bg:#fbfbfa; --panel:#fff; --fg:#1a1a18; --muted:#6b6b66;
    --line:#e4e4e0; --line2:#d0d0ca; --accent:#2d6a5a; --sky:#eef3f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  header{
    padding:14px 20px 10px 1in; border-bottom:1px solid var(--line);
    background:var(--panel); display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center;
  }
  .back{font-size:12.5px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--accent)}
  h1{margin:0;font-size:16px;font-weight:640;letter-spacing:-.015em}
  .sub{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .ctrls{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
  .ctrl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
  .ctrl select,.ctrl input[type=number]{
    font:inherit;font-size:12.5px;padding:4px 7px;border:1px solid var(--line2);
    border-radius:6px;background:#fff;color:var(--fg)
  }
  .ctrl input[type=number]{width:72px}
  button.act{
    font:inherit;font-size:12.5px;font-weight:560;padding:6px 12px;border-radius:7px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer
  }
  button.act.ghost{background:#fff;color:var(--accent)}

  main{flex:1;min-height:0;overflow:auto;padding:0 14px 14px 81px}
  .wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:12px 14px 14px;display:inline-block;min-width:min-content}
  #svghost{display:block}
  svg{display:block}
  .empty{
    max-width:640px;margin:64px auto;text-align:center;color:var(--muted);
  }
  .empty h2{color:var(--fg);font-size:17px;margin:0 0 10px}
  .empty code{background:#f0f0ec;padding:2px 6px;border-radius:4px;font-size:12.5px}
  .empty ol{text-align:left;display:inline-block;margin:14px 0 0;line-height:1.8}

  .stripwrap{position:relative;margin:0 0 4px;flex:none}
  .strip{
    height:380px;border:1px solid var(--line2);border-radius:8px;overflow:hidden;
    background:#eceae4
  }
  .stripcap{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:10.5px;font-weight:640;letter-spacing:.07em;text-transform:uppercase;
    color:#85857e;margin:0 0 5px
  }
  .northrose{
    position:absolute;left:10px;top:10px;z-index:2;pointer-events:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))
  }
  .northrose svg{display:block;transform-origin:22px 26px;transition:transform .15s linear}
  .strip .mapboxgl-ctrl-logo,.strip .mapboxgl-ctrl-attrib{transform:scale(.82);transform-origin:bottom left}
  .leghead{
    flex:none;margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px
  }
  .leghead h2{margin:0;font-size:12.5px;font-weight:640;letter-spacing:-.01em}
  .leghead .n{font-size:11.5px;color:var(--muted)}
  .legend{
    margin-top:11px;
    display:flex;flex-wrap:wrap;gap:16px 26px;
  }
  .legend:empty{display:none}
  .fam{min-width:150px}
  .fam h3{margin:0 0 6px;font-size:10.5px;font-weight:640;letter-spacing:.07em;
          text-transform:uppercase;color:#85857e}
  .li{display:flex;align-items:center;gap:7px;font-size:12px;padding:1.5px 0}
  .li i{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.2);flex:none}
  .li b{font-weight:560;font-variant-numeric:tabular-nums}
  .li span{color:var(--muted)}
  .li u{margin-left:auto;padding-left:12px;text-decoration:none;color:#9a9a92;
        font-variant-numeric:tabular-nums;font-size:11px}
  .fam{min-width:210px}

  .note{
    margin-top:12px;font-size:12.5px;color:#4a5a52;background:#eef5f2;
    border:1px solid #cfe3db;border-radius:8px;padding:9px 12px;line-height:1.5
  }
  .warn{
    margin-top:12px;font-size:12.5px;color:#8a5a12;background:#fdf3e3;
    border:1px solid #f0dfc0;border-radius:8px;padding:9px 12px
  }
  @media print{
    /* A section can be far wider than a page, so #xs-wrap is scaled to fit by
       fitForPrint() before the dialog opens. Printable area at .35in margins on
       11x8.5 paper is 10.3 x 7.8in. `zoom` shrinks the layout box (unlike
       transform), so ordinary flex centring puts the scaled sheet in the middle
       of the page both ways. */
    html,body{background:#fff;height:100%}
    body{display:flex;flex-direction:column}
    header .ctrls,.back{display:none}
    header{padding:0 0 8px;border-bottom:1px solid #ccc;flex:none}
    .leghead,.legend{margin-left:0}
    main{padding:0;overflow:visible;flex:1;min-height:0;
         display:flex;align-items:center;justify-content:flex-start}
    .wrap{border:0;padding:0;background:#fff;min-height:0}
    .strip{border:1px solid #bbb}
    #xs-wrap{margin:0}
    .mapboxgl-ctrl-attrib-button{display:none}
    #svghost{flex:none}
    svg{display:block;margin:0}
  }
</style>
</head>
<body>

<header>
  <div>
    <a class="back" href="../faults/">← Geology &amp; Faults map</a>
    <h1>Borehole Cross-Section</h1>
    <p class="sub" id="sub">—</p>
  </div>
  <div class="ctrls">
    <label class="ctrl">Corridor ±
      <input type="number" id="c-buf" value="1000" min="50" max="20000" step="50"> ft
    </label>
    <label class="ctrl">Vertical exaggeration
      <select id="c-ve">
        <option value="auto" selected>Auto</option>
        <option value="fit">Fit page</option>
        <option value="1">1×</option><option value="2">2×</option><option value="5">5×</option>
        <option value="10">10×</option><option value="20">20×</option><option value="50">50×</option>
      </select>
    </label>
    <label class="ctrl">Between holes
      <select id="c-fill">
        <option value="none">Columns only</option>
        <option value="nearest" selected>Continuous fill</option>
      </select>
    </label>
    <label class="ctrl">Datum
      <select id="c-datum">
        <option value="elev">Elevation (ft)</option>
        <option value="depth">Depth below collar (ft)</option>
      </select>
    </label>
    <label class="ctrl">Paper
      <select id="c-orient">
        <option value="landscape">11 × 8.5 landscape</option>
        <option value="portrait">8.5 × 11 portrait</option>
      </select>
    </label>
    <button class="act ghost" id="c-print">Print</button>
  </div>
</header>

<main id="main"><div class="empty">Loading…</div></main>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<script src="./litho.js"></script>
<script>
mapboxgl.accessToken = atob('cGsuZXlKMUlqb2lhbVJsZG05NUlpd2lZU0k2SW1OdGN6bGljVE0xZURCamRHWXpNRzlsYkhZMmVub3hPRFFpZlEuWTBrbWgxTzNWbVpuV2tQX0lMaWJuQQ==');

var BORE_URL = '../faults/boreholes.geojson';
var LITH_URL = './lithology.json';

// ---------- section line ----------
// ?line=lon,lat;lon,lat;...   (written by the "Cross-section" button on the map)
function parseLine() {
  var q = new URLSearchParams(location.search).get('line');
  if (!q) return null;
  var pts = q.split(';').map(function (p) {
    var a = p.split(',');
    return [parseFloat(a[0]), parseFloat(a[1])];
  }).filter(function (c) { return isFinite(c[0]) && isFinite(c[1]); });
  return pts.length >= 2 ? pts : null;
}

// ---------- geometry ----------
// Local equirectangular projection in feet, referenced to the line's own centroid.
// Over a few km this is well under a foot of error and keeps the maths simple.
var FT_PER_DEG_LAT = 364000;
function projector(refLat) {
  var kx = FT_PER_DEG_LAT * Math.cos(refLat * Math.PI / 180);
  return function (c) { return [c[0] * kx, c[1] * FT_PER_DEG_LAT]; };
}

function segmentDistance(p, a, b) {
  var vx = b[0] - a[0], vy = b[1] - a[1];
  var wx = p[0] - a[0], wy = p[1] - a[1];
  var L2 = vx * vx + vy * vy;
  var t = L2 ? (wx * vx + wy * vy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  var px = a[0] + t * vx, py = a[1] + t * vy;
  return { t: t, dist: Math.hypot(p[0] - px, p[1] - py) };
}

// Distance along the polyline + perpendicular offset for one point.
function stationOf(p, poly) {
  var best = null, run = 0;
  for (var i = 0; i < poly.length - 1; i++) {
    var a = poly[i], b = poly[i + 1];
    var segLen = Math.hypot(b[0] - a[0], b[1] - a[1]);
    var r = segmentDistance(p, a, b);
    if (!best || r.dist < best.off) best = { along: run + r.t * segLen, off: r.dist };
    run += segLen;
  }
  return best ? { along: best.along, off: best.off, total: run } : null;
}

function niceStep(range, target) {
  var raw = range / Math.max(1, target);
  var pow = Math.pow(10, Math.floor(Math.log10(raw)));
  var n = raw / pow;
  var step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return step * pow;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ---------- state ----------
var LINE = parseLine(), BORES = null, LITH = null;
var opts = { buf: 1000, ve: 'auto', datum: 'elev', fill: 'nearest' };

function showEmpty(msg) {
  document.getElementById('main').innerHTML =
    '<div class="empty"><h2>No section line</h2>' +
    '<p>' + msg + '</p>' +
    '<ol>' +
    '<li>Open the <a href="../faults/">Geology &amp; Faults map</a></li>' +
    '<li>Pick the <b>Line</b> tool in the drawing palette</li>' +
    '<li>Click along your section, then double-click to finish</li>' +
    '<li>Press <b>Cross-section</b> in the layers panel</li>' +
    '</ol></div>';
  document.getElementById('sub').textContent = 'no line supplied';
}

Promise.all([
  fetch(BORE_URL).then(function (r) { return r.json(); }),
  fetch(LITH_URL).then(function (r) { return r.json(); })
]).then(function (res) {
  BORES = res[0].features; LITH = res[1];
  if (!LINE) { showEmpty('Draw a line on the map, then send it here.'); return; }
  bind(); render();
}).catch(function (e) {
  document.getElementById('main').innerHTML =
    '<div class="empty"><h2>Could not load data</h2><p>' + esc(e.message) + '</p></div>';
});

// ---------- fit the whole sheet onto one 11 x 8.5 page ----------
// 1in binding margin at the top and left; the trailing edges stay tight.
var MARGIN = { top: 1, right: 1, bottom: 0.35, left: 1 };
function pageBoxPx() {
  var portrait = document.getElementById('c-orient') &&
                 document.getElementById('c-orient').value === 'portrait';
  var w = (portrait ? 8.5 : 11) - MARGIN.left - MARGIN.right;
  var h = (portrait ? 11 : 8.5) - MARGIN.top - MARGIN.bottom;
  return { w: w * 96, h: h * 96, portrait: portrait };
}
function setPageSize() {
  var p = pageBoxPx();
  document.getElementById('pagecss').textContent =
    '@page{size:' + (p.portrait ? '8.5in 11in' : '11in 8.5in') +
    ';margin:' + MARGIN.top + 'in ' + MARGIN.right + 'in ' +
    MARGIN.bottom + 'in ' + MARGIN.left + 'in}';
}
function fitForPrint() {
  var wrap = document.getElementById('xs-wrap');
  if (!wrap) return;
  wrap.style.zoom = '';
  wrap.style.transform = '';
  var box = pageBoxPx();
  // measure the header rather than assuming its height
  var hdr = document.querySelector('header');
  var hdrH = hdr ? hdr.getBoundingClientRect().height : 34;
  var avail = Math.max(120, box.h - hdrH - 10);
  var nw = wrap.scrollWidth, nh = wrap.scrollHeight;
  if (!nw || !nh) return;
  var z = Math.min(1, box.w / nw, avail / nh);
  wrap.style.zoom = z;
}
var rzTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(function () { if (LINE && BORES && LITH) render(); }, 140);
});
window.addEventListener('beforeprint', fitForPrint);
window.addEventListener('afterprint', function () {
  var w = document.getElementById('xs-wrap');
  if (w) { w.style.zoom = ''; w.style.transform = ''; }
});

function bind() {
  document.getElementById('c-buf').addEventListener('change', function () {
    opts.buf = Math.max(50, +this.value || 1000); render();
  });
  document.getElementById('c-ve').addEventListener('change', function () {
    opts.ve = this.value; render();
  });
  document.getElementById('c-datum').addEventListener('change', function () {
    opts.datum = this.value; render();
  });
  document.getElementById('c-fill').addEventListener('change', function () {
    opts.fill = this.value; render();
  });
  document.getElementById('c-orient').addEventListener('change', function () {
    setPageSize(); render();
  });
  document.getElementById('c-print').addEventListener('click', function () {
    setPageSize(); fitForPrint();
    setTimeout(function () { window.print(); }, 250);
  });
  setPageSize();
}

// ---------- pick boreholes along the line ----------
function collect() {
  var refLat = LINE.reduce(function (s, c) { return s + c[1]; }, 0) / LINE.length;
  var proj = projector(refLat);
  var poly = LINE.map(proj);

  var hits = [];
  BORES.forEach(function (f) {
    var id = f.properties.id;
    var iv = id && LITH[id];
    if (!iv || !iv.length) return;                 // only boreholes with lithology
    var st = stationOf(proj(f.geometry.coordinates), poly);
    if (!st || st.off > opts.buf) return;
    hits.push({
      name: f.properties.n || '(unnamed)',
      id: id,
      elev: (f.properties.e != null ? f.properties.e : 0),
      hasElev: f.properties.e != null,
      depth: f.properties.d,
      along: st.along, off: st.off,
      lonlat: f.geometry.coordinates,
      iv: iv
    });
  });
  hits.sort(function (a, b) { return a.along - b.along; });
  var total = poly.reduce(function (acc, c, i) {
    return i ? acc + Math.hypot(c[0] - poly[i - 1][0], c[1] - poly[i - 1][1]) : 0;
  }, 0);
  return { hits: hits, total: total };
}

// ---------- plan-view strip ----------
// Rotated so the section runs left-to-right, matching the diagram beneath it.
var stripMap = null, stripReady = false, pendingStrip = null;

// Mapbox `bearing` is the compass direction drawn at the TOP of the map, so to
// lay the section out left-to-right (A on the left, A' on the right) the map must
// be rotated to the line's bearing MINUS 90 — that puts the line's heading on the
// screen's x-axis instead of its y-axis.
function sectionBearing() {
  var a = LINE[0], b = LINE[LINE.length - 1];
  return (bearingOf(a, b) - 90 + 360) % 360;
}

function bearingOf(a, b) {
  var la1 = a[1] * Math.PI / 180, la2 = b[1] * Math.PI / 180;
  var dLo = (b[0] - a[0]) * Math.PI / 180;
  var y = Math.sin(dLo) * Math.cos(la2);
  var x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLo);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function initStrip() {
  if (stripMap) return;
  stripMap = new mapboxgl.Map({
    container: 'strip',
    style: 'mapbox://styles/mapbox/streets-v12',   // streets-v12 carries the road names
    center: LINE[0], zoom: 12,
    attributionControl: true, interactive: true
  });
  stripMap.addControl(new mapboxgl.ScaleControl({ unit: 'imperial' }), 'bottom-right');
  stripMap.on('load', function () {
    stripMap.addSource('xs-line', { type: 'geojson', data: emptyFC() });
    stripMap.addSource('xs-bores', { type: 'geojson', data: emptyFC() });

    stripMap.addLayer({
      id: 'xs-line-casing', type: 'line', source: 'xs-line',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#ffffff', 'line-width': 6, 'line-opacity': 0.9 }
    });
    stripMap.addLayer({
      id: 'xs-line-main', type: 'line', source: 'xs-line',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#c0392b', 'line-width': 2.6 }
    });
    stripMap.addLayer({
      id: 'xs-bore-dot', type: 'circle', source: 'xs-bores',
      paint: {
        'circle-radius': 5,
        'circle-color': '#10233f',
        'circle-stroke-color': '#ffffff',
        'circle-stroke-width': 1.6
      }
    });
    stripMap.addLayer({
      id: 'xs-bore-label', type: 'symbol', source: 'xs-bores',
      layout: {
        'text-field': ['get', 'n'],
        'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular'],
        'text-size': 10.5,
        'text-offset': [0, 1.15],
        'text-anchor': 'top',
        'text-allow-overlap': false,
        'text-padding': 2
      },
      paint: {
        'text-color': '#10233f',
        'text-halo-color': 'rgba(255,255,255,.95)',
        'text-halo-width': 1.5
      }
    });
    stripReady = true;
    syncNorth();
    if (pendingStrip) { updateStrip(pendingStrip); pendingStrip = null; }
  });
}

function emptyFC() { return { type: 'FeatureCollection', features: [] }; }

// The strip is rotated so the section reads left-to-right, so the rose has to
// counter-rotate to keep pointing at true north. Screen-up shows compass bearing
// b, so north sits at -b.
function syncNorth() {
  if (!stripMap) return;
  var rose = document.querySelector('#northrose svg');
  if (!rose) return;
  // normalise to -180..180 so the transition takes the short way round
  var deg = -stripMap.getBearing() % 360;
  if (deg > 180) deg -= 360;
  if (deg < -180) deg += 360;
  rose.style.transform = 'rotate(' + (Math.round(deg * 10) / 10) + 'deg)';
}

function updateStrip(hits) {
  if (!stripMap) { initStrip(); pendingStrip = hits; return; }
  if (!stripReady) { pendingStrip = hits; return; }

  stripMap.getSource('xs-line').setData({
    type: 'FeatureCollection',
    features: [{ type: 'Feature', properties: {},
                 geometry: { type: 'LineString', coordinates: LINE } }]
  });
  stripMap.getSource('xs-bores').setData({
    type: 'FeatureCollection',
    features: hits.map(function (h) {
      return { type: 'Feature', properties: { n: h.name },
               geometry: { type: 'Point', coordinates: h.lonlat } };
    })
  });

  var b = new mapboxgl.LngLatBounds();
  LINE.forEach(function (c) { b.extend(c); });
  hits.forEach(function (h) { b.extend(h.lonlat); });
  stripMap.resize();
  stripMap.fitBounds(b, {
    bearing: sectionBearing(),
    padding: { top: 34, bottom: 34, left: 44, right: 44 },
    duration: 0
  });
  syncNorth();
}

// ---------- draw ----------
function ensureShell() {
  if (document.getElementById('xs-wrap')) return;
  document.getElementById('main').innerHTML =
    '<div class="wrap" id="xs-wrap">' +
      '<div class="stripwrap" id="stripwrap">' +
        '<div class="stripcap"><span>A — plan view</span><span>A\u2032</span></div>' +
        '<div class="strip" id="strip">' +
          '<div class="northrose" id="northrose" title="North">' +
            '<svg viewBox="0 0 44 56" width="44" height="56" aria-label="North arrow">' +
              '<circle cx="22" cy="26" r="19" fill="rgba(255,255,255,.86)" stroke="#b9b9b0"/>' +
              '<polygon points="22,7 29,30 22,25 15,30" fill="#2a2a26"/>' +
              '<polygon points="22,25 29,30 22,45 15,30" fill="#9a9a92"/>' +
              '<text x="22" y="54" text-anchor="middle" font-size="12" font-weight="700" ' +
                'font-family="ui-sans-serif,Helvetica,Arial" fill="#2a2a26">N</text>' +
            '</svg>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div id="svghost"></div>' +
      '<div id="warnhost"></div>' +
      '<div class="leghead" id="leghead"></div>' +
      '<div class="legend" id="leghost"></div>' +
    '</div>';
}

function render() {
  var got = collect(), hits = got.hits;
  var sub = document.getElementById('sub');

  if (!hits.length) {
    stripMap = null; stripReady = false; pendingStrip = null;
    document.getElementById('main').innerHTML =
      '<div class="empty"><h2>No boreholes within the corridor</h2>' +
      '<p>The section line is ' + Math.round(got.total).toLocaleString() + ' ft long, but no ' +
      'borehole with lithology falls within ±' + opts.buf.toLocaleString() + ' ft of it. ' +
      'Widen the corridor, or draw the line closer to the borehole cluster ' +
      '(they sit in northern Orange County).</p></div>';
    sub.textContent = Math.round(got.total).toLocaleString() + ' ft section · 0 boreholes';
    return;
  }

  // vertical range
  var lo = Infinity, hi = -Infinity;
  hits.forEach(function (h) {
    var base = opts.datum === 'elev' ? h.elev : 0;
    var deepest = h.iv[h.iv.length - 1][1];
    var top = opts.datum === 'elev' ? h.elev : 0;
    var bot = opts.datum === 'elev' ? h.elev - deepest : -deepest;
    lo = Math.min(lo, bot); hi = Math.max(hi, top);
  });
  var pad = Math.max(5, (hi - lo) * 0.08);
  lo -= pad; hi += pad;

  var xRange = Math.max(got.total, 1);
  var yRange = Math.max(hi - lo, 1);

  var M = { l: 67, r: 26, t: 46, b: 56 };   // 67 + 29px of padding/border = 1in

  ensureShell();
  var host = document.getElementById('svghost');
  var availW = Math.max(420, (host.clientWidth || window.innerWidth - 60));
  var availH = Math.max(240, (host.clientHeight || 420));
  var usedAvailH = availH;

  var PLOT_W, PLOT_H, ve, veCapped = false;
  if (opts.ve === 'fit') {
    // opt-in: stretch to whatever space the window leaves
    PLOT_W = Math.max(320, availW - M.l - M.r);
    PLOT_H = Math.max(200, availH - M.t - M.b);
    ve = (xRange / PLOT_W) / (yRange / PLOT_H);
  } else {
    // original sizing: width follows section length, height follows exaggeration
    PLOT_W = Math.min(1500, Math.max(760, xRange / 12));
    ve = opts.ve === 'auto'
      ? Math.max(1, Math.min(60, (xRange / PLOT_W) / (yRange / 420)))
      : +opts.ve;
    PLOT_H = Math.max(260, Math.min(900, (yRange / (xRange / PLOT_W)) * ve));
  }

  var W = PLOT_W + M.l + M.r, H = PLOT_H + M.t + M.b;
  var sx = function (v) { return M.l + (v / xRange) * PLOT_W; };
  var sy = function (v) { return M.t + ((hi - v) / yRange) * PLOT_H; };

  var COLW = Math.max(7, Math.min(20, PLOT_W / (hits.length * 2.4)));

  var o = [];
  o.push('<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H +
         '" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">');

  // sky / ground backdrop
  o.push('<rect x="' + M.l + '" y="' + M.t + '" width="' + PLOT_W + '" height="' + PLOT_H +
         '" fill="var(--sky)"/>');

  // ---- horizontal grid + left scale (the depth/elevation axis) ----
  var yStep = niceStep(yRange, 8);
  var y0 = Math.ceil(lo / yStep) * yStep;
  for (var v = y0; v <= hi; v += yStep) {
    var yy = sy(v);
    o.push('<line x1="' + M.l + '" y1="' + yy.toFixed(1) + '" x2="' + (M.l + PLOT_W) +
           '" y2="' + yy.toFixed(1) + '" stroke="#c8d2da" stroke-width="0.7"/>');
    o.push('<text x="' + (M.l - 9) + '" y="' + (yy + 3.5).toFixed(1) +
           '" text-anchor="end" font-size="11" fill="#55554f">' +
           Math.round(v).toLocaleString() + '</text>');
  }
  o.push('<text transform="translate(16,' + (M.t + PLOT_H / 2) + ') rotate(-90)" text-anchor="middle" ' +
         'font-size="11.5" font-weight="600" fill="#3a3a35">' +
         (opts.datum === 'elev' ? 'Elevation (ft)' : 'Depth below collar (ft)') + '</text>');

  // ---- horizontal distance axis ----
  var xStep = niceStep(xRange, 8);
  for (var d = 0; d <= xRange; d += xStep) {
    var xx = sx(d);
    o.push('<line x1="' + xx.toFixed(1) + '" y1="' + (M.t + PLOT_H) + '" x2="' + xx.toFixed(1) +
           '" y2="' + (M.t + PLOT_H + 5) + '" stroke="#8a8a82" stroke-width="1"/>');
    o.push('<text x="' + xx.toFixed(1) + '" y="' + (M.t + PLOT_H + 18) +
           '" text-anchor="middle" font-size="11" fill="#55554f">' +
           Math.round(d).toLocaleString() + '</text>');
  }
  o.push('<text x="' + (M.l + PLOT_W / 2) + '" y="' + (H - 12) + '" text-anchor="middle" ' +
         'font-size="11.5" font-weight="600" fill="#3a3a35">Distance along section (ft)</text>');

  // ---- ground surface line ----
  if (opts.datum === 'elev' && hits.length > 1) {
    var pathPts = hits.map(function (h) { return sx(h.along).toFixed(1) + ',' + sy(h.elev).toFixed(1); });
    o.push('<polyline points="' + pathPts.join(' ') + '" fill="none" stroke="#6f6f66" ' +
           'stroke-width="1.4" stroke-dasharray="5 3"/>');
  }

  // ---- A / A' end labels ----
  o.push('<text x="' + M.l + '" y="' + (M.t - 22) + '" font-size="13" font-weight="700" fill="#1a1a18">A</text>');
  o.push('<text x="' + (M.l + PLOT_W) + '" y="' + (M.t - 22) + '" text-anchor="end" font-size="13" ' +
         'font-weight="700" fill="#1a1a18">A′</text>');

  // ---- continuous fill between holes ----
  // Between each adjacent pair the panel is split at the midpoint: the left half
  // takes the left hole's log, the right half the right hole's. Each interval is
  // drawn as a trapezoid whose top and bottom follow the ground surface, which is
  // interpolated linearly between collar elevations. Individual layers are NOT
  // correlated hole-to-hole — that is interpretation, so lithology changes at the
  // midpoint rather than sloping into the neighbouring hole's sequence.
  var used = {};
  if (opts.fill === 'nearest' && hits.length > 1) {
    var surfOf = function (h) { return opts.datum === 'elev' ? h.elev : 0; };
    for (var q = 0; q < hits.length - 1; q++) {
      var A = hits[q], B = hits[q + 1];
      var aX = A.along, bX = B.along, mX = (aX + bX) / 2;
      var aS = surfOf(A), bS = surfOf(B);
      var lerpS = function (xx) {
        var t = (bX - aX) > 0 ? (xx - aX) / (bX - aX) : 0;
        return aS + (bS - aS) * t;
      };
      [[A, aX, mX], [B, mX, bX]].forEach(function (panel) {
        var hole = panel[0], xa = panel[1], xb = panel[2];
        if (xb <= xa) return;
        var sA = lerpS(xa), sB = lerpS(xb);
        var pxa = sx(xa), pxb = sx(xb);
        hole.iv.forEach(function (seg) {
          var t0 = seg[0], b0 = seg[1], code = seg[2];
          used[code] = used[code] || 0;
          var pts = [
            pxa.toFixed(1) + ',' + sy(sA - t0).toFixed(1),
            pxb.toFixed(1) + ',' + sy(sB - t0).toFixed(1),
            pxb.toFixed(1) + ',' + sy(sB - b0).toFixed(1),
            pxa.toFixed(1) + ',' + sy(sA - b0).toFixed(1)
          ].join(' ');
          o.push('<polygon points="' + pts + '" fill="' + (LITHO_COLOR[code] || '#cccccc') +
                 '" opacity="0.62"/>');
        });
      });
    }
    // interpolated ground surface
    var surfPts = hits.map(function (h) {
      return sx(h.along).toFixed(1) + ',' + sy(opts.datum === 'elev' ? h.elev : 0).toFixed(1);
    });
    o.push('<polyline points="' + surfPts.join(' ') + '" fill="none" stroke="#6f6f66" stroke-width="1"/>');
  }

  // ---- borehole columns ----
  hits.forEach(function (h) {
    var cx = sx(h.along), top = opts.datum === 'elev' ? h.elev : 0;
    h.iv.forEach(function (seg) {
      var t = seg[0], b = seg[1], code = seg[2];
      used[code] = (used[code] || 0) + (b - t);
      var yTop = sy(top - t), yBot = sy(top - b);
      var hgt = Math.max(0.7, yBot - yTop);
      o.push('<rect x="' + (cx - COLW / 2).toFixed(1) + '" y="' + yTop.toFixed(1) +
             '" width="' + COLW.toFixed(1) + '" height="' + hgt.toFixed(1) +
             '" fill="' + (LITHO_COLOR[code] || '#cccccc') + '" stroke="rgba(0,0,0,.55)" ' +
             'stroke-width="' + (opts.fill === 'nearest' ? 0.8 : 0.4) + '"><title>' + esc(h.name) + '  ' + t + '–' + b + ' ft\n' +
             esc(code) + ' · ' + esc(LITHO_LABEL[code] || code) + '</title></rect>');
    });
    // collar tick + name
    o.push('<line x1="' + (cx - COLW / 2 - 2).toFixed(1) + '" y1="' + sy(top).toFixed(1) +
           '" x2="' + (cx + COLW / 2 + 2).toFixed(1) + '" y2="' + sy(top).toFixed(1) +
           '" stroke="#1a1a18" stroke-width="1.2"/>');
    o.push('<text transform="translate(' + cx.toFixed(1) + ',' + (M.t - 8) +
           ') rotate(-52)" font-size="9.5" fill="#3a3a35">' + esc(h.name) + '</text>');
  });

  o.push('<rect x="' + M.l + '" y="' + M.t + '" width="' + PLOT_W + '" height="' + PLOT_H +
         '" fill="none" stroke="#9a9a92" stroke-width="1"/>');
  o.push('</svg>');

  // ---- legend, only the units actually present ----
  var leg = [];
  LITHO_LEGEND.forEach(function (fam) {
    var items = fam.items.filter(function (it) { return used[it.code]; });
    if (!items.length) return;
    leg.push('<div class="fam"><h3>' + esc(fam.family) + '</h3>' +
      items.map(function (it) {
        return '<div class="li"><i style="background:' + it.color + '"></i>' +
               '<b>' + esc(it.code) + '</b> <span>' + esc(it.label) + '</span>' +
               '<u>' + Math.round(used[it.code]).toLocaleString() + ' ft</u></div>';
      }).join('') + '</div>');
  });

  var noElev = hits.filter(function (h) { return !h.hasElev; }).length;
  var warn = '';
  if (opts.fill === 'nearest') {
    warn += '<div class="note">Colour between holes is <b>interpolated</b>. Each panel is ' +
            'split at the midpoint and takes the log of the nearer borehole; the ground ' +
            'surface follows a straight line between collar elevations. Individual layers ' +
            'are <b>not</b> correlated hole-to-hole — that is interpretation, not data — so ' +
            'lithology changes at the midpoint. The outlined columns are the logged intervals.</div>';
  }
  if (opts.datum === 'elev' && noElev) {
    warn = '<div class="warn">' + noElev + ' of ' + hits.length + ' boreholes have no collar ' +
           'elevation in the source data and are hung from 0 ft. Switch Datum to ' +
           '“Depth below collar” to compare them on equal footing.</div>';
  }

  // Strip spans exactly the plot area so plan view and section share an x-extent.
  var sw = document.getElementById('stripwrap');
  sw.style.marginLeft = '0px';
  sw.style.width = W + 'px';
  document.getElementById('svghost').innerHTML = o.join('');
  document.getElementById('warnhost').innerHTML = warn;
  var nUnits = Object.keys(used).length;
  var totalFt = 0;
  Object.keys(used).forEach(function (k) { totalFt += used[k]; });
  document.getElementById('leghead').innerHTML =
    '<h2>Lithology</h2><span class="n">' + nUnits + ' USCS unit' + (nUnits === 1 ? '' : 's') +
    ' logged in this section · ' + Math.round(totalFt).toLocaleString() +
    ' ft of core · thickness shown per unit</span>';
  document.getElementById('leghost').innerHTML = leg.join('');
  updateStrip(hits);

  // The legend is written after the drawing is sized, so on the first pass svghost
  // measured taller than it ends up. Re-render once if the space actually changed.
  var nowH = document.getElementById('svghost').clientHeight;
  if (!render._fixing && nowH && Math.abs(nowH - usedAvailH) > 18) {
    render._fixing = true;
    render();
    render._fixing = false;
  }

  document.getElementById('sub').textContent =
    Math.round(got.total).toLocaleString() + ' ft section · ' + hits.length +
    ' boreholes · ±' + opts.buf.toLocaleString() + ' ft corridor · VE ' +
    (Math.round(ve * 10) / 10) + '×' +
    (opts.ve === 'fit' ? ' (fit page)' : '');
}
</script>
</body>
</html>
