<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multifamily Site Report</title>
<!-- GEO_FAMILY / GEO_COLORS: the same geology lookups the map uses, so a unit
     code is described here exactly as it is described there. -->
<script src="./palette.js"></script>
<style>
  :root{
    --ink:#1a1a18; --ink2:#44443e; --mute:#7a7a72; --line:#e2e2db;
    --paper:#ffffff; --tint:#f7f7f2; --accent:#2d6a5a; --warn:#8a2b1c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#edede7;color:var(--ink);
       font:15px/1.55 "Helvetica Neue",Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  .sheet{max-width:860px;margin:24px auto;background:var(--paper);
         box-shadow:0 2px 18px rgba(0,0,0,.12)}
  .pad{padding:34px 44px}
  /* ---- masthead ---- */
  header{border-bottom:3px solid var(--accent);padding:26px 44px 22px}
  .brand{display:flex;align-items:center;justify-content:space-between;
         gap:18px;margin-bottom:18px}
  .brand img{height:42px;width:auto;display:block}
  .pdf{font:inherit;font-size:13px;font-weight:560;padding:8px 15px;
       border-radius:8px;cursor:pointer;border:1px solid var(--accent);
       background:var(--accent);color:#fff;white-space:nowrap}
  .pdf:hover{background:#255a4c}
  @media(max-width:560px){.brand{flex-direction:column;align-items:flex-start}}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
           color:var(--accent);font-weight:700}
  h1{margin:6px 0 2px;font-size:27px;line-height:1.18;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--ink2);font-size:14.5px}
  .badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .badge{border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:var(--tint);min-width:92px}
  .badge .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:650}
  .badge .v{font-size:19px;font-weight:650;line-height:1.25}
  .badge .v small{font-size:12px;font-weight:500;color:var(--mute)}
  /* ---- sections ---- */
  h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
     margin:0 0 14px;padding-bottom:7px;border-bottom:1px solid var(--line);font-weight:700}
  section{padding:28px 44px;border-top:1px solid var(--line)}
  section:first-of-type{border-top:0}
  h3{font-size:14.5px;margin:22px 0 8px;font-weight:650}
  h3:first-child{margin-top:0}
  p{margin:0 0 11px}
  .lede{font-size:15.5px;color:var(--ink2)}
  /* ---- data tables ---- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0 14px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #f0f0ea;vertical-align:top}
  th{width:42%;font-weight:600;color:var(--ink2)}
  td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr:last-child th,tr:last-child td{border-bottom:0}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
  @media(max-width:640px){.kv{grid-template-columns:1fr}}
  /* ---- figures ---- */
  figure{margin:16px 0 20px}
  figure img{width:100%;display:block;border:1px solid var(--line);border-radius:7px;background:var(--tint)}
  figcaption{font-size:12px;color:var(--mute);margin-top:7px;line-height:1.45}
  figcaption b{color:var(--ink2);font-weight:650}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  /* ---- callouts ---- */
  .note{background:var(--tint);border-left:3px solid var(--accent);padding:12px 15px;
        font-size:13px;color:var(--ink2);margin:14px 0;border-radius:0 6px 6px 0}
  .gap{background:#fdf6ec;border-left:3px solid #b8860b;padding:12px 15px;
       font-size:13px;color:#5c4a1e;margin:14px 0;border-radius:0 6px 6px 0}
  .hz{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid #f0f0ea;font-size:13.5px}
  .hz:last-child{border-bottom:0}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;margin-top:5px}
  .hz .nm{font-weight:600;min-width:188px}
  .hz .dt{color:var(--ink2)}
  .ok{background:#4e9a6a}.bad{background:var(--warn)}.unk{background:#b9b9b2}
  footer{padding:22px 44px 30px;border-top:1px solid var(--line);font-size:11.5px;
         color:var(--mute);line-height:1.5}
  .err{padding:60px 44px;text-align:center;color:var(--warn)}
  @media print{
    body{background:#fff}
    .sheet{box-shadow:none;margin:0;max-width:none}
    section{page-break-inside:avoid}
    figure{page-break-inside:avoid}
    /* The button is a control, not content. */
    .pdf{display:none}
    /* Without this the swatches, score bars and crime chart print as empty
       outlines -- browsers drop background fills by default, and every colour
       in this report carries meaning. */
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    a{text-decoration:none;color:inherit}
    /* A URL after every link is noise in a printed report; the Redfin and
       source links are not the point of the page. */
    a[href]:after{content:none}
  }
  @page{margin:14mm 12mm}
</style>

<script>
var TOKEN = atob('cGsuZXlKMUlqb2lhbVJsZG05NUlpd2lZU0k2SW1OdGN6bGljVE0xZURCamRHWXpNRzlsYkhZMmVub3hPRFFpZlEuWTBrbWgxTzNWbVpuV2tQX0lMaWJuQQ==');

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function num(v,d){return v==null||v===''||isNaN(v)?(d==null?'—':d)
  :Number(v).toLocaleString(undefined,{maximumFractionDigits:0});}
function usd(v){return v==null||v===''||isNaN(v)||+v===0?'—':'$'+num(v);}
function pct(v,dp){return v==null||v===''||isNaN(v)?'—':(+v).toFixed(dp==null?1:dp)+'%';}
function ft(v){return v==null||isNaN(v)?'—':num(Math.round(v))+' ft';}

/* ---------- charts: inline SVG, no library ---------- */
function barChart(rows,opt){
  opt=opt||{};
  var w=opt.w||420, bh=opt.bh||22, gap=8, lw=opt.lw||150, pad=4;
  var max=opt.max||Math.max.apply(null,rows.map(function(r){return r.v||0;}))||1;
  var h=rows.length*(bh+gap)-gap+pad*2;
  var s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img">';
  rows.forEach(function(r,i){
    var y=pad+i*(bh+gap), bw=Math.max(1,(w-lw-58)*((r.v||0)/max));
    s+='<text x="0" y="'+(y+bh*0.72)+'" font-size="12" fill="#44443e">'+esc(r.k)+'</text>';
    s+='<rect x="'+lw+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+(r.c||'#6a51a3')+'"/>';
    s+='<text x="'+(lw+bw+7)+'" y="'+(y+bh*0.72)+'" font-size="12" fill="#1a1a18" '+
       'font-weight="600">'+esc(r.lbl!=null?r.lbl:r.v)+'</text>';
  });
  return s+'</svg>';
}
function stackBar(parts,w){
  w=w||420; var h=26, x=0, tot=parts.reduce(function(a,b){return a+(b.v||0);},0)||1;
  var s='<svg viewBox="0 0 '+w+' '+(h+22)+'" width="100%" height="'+(h+22)+'" role="img">';
  parts.forEach(function(p){
    var pw=w*((p.v||0)/tot);
    s+='<rect x="'+x+'" y="0" width="'+Math.max(0,pw-2)+'" height="'+h+'" rx="3" fill="'+p.c+'"/>';
    if(pw>58) s+='<text x="'+(x+7)+'" y="'+(h*0.68)+'" font-size="12" fill="#fff" '+
      'font-weight="600">'+(+p.v).toFixed(0)+'%</text>';
    x+=pw;
  });
  x=0;
  parts.forEach(function(p){
    var pw=w*((p.v||0)/tot);
    if(pw>58) s+='<text x="'+(x+7)+'" y="'+(h+16)+'" font-size="11" fill="#7a7a72">'+esc(p.k)+'</text>';
    x+=pw;
  });
  return s+'</svg>';
}
/* Percentile bars against a marked national median. The reference line matters
   more than the bars: 50 is the middle of all US block groups, so a bar near it
   is unremarkable and a reader without the line has no way to know that.
   One hue, no red/amber/green banding -- thresholds would assert a judgement
   about what counts as a safe area that this data does not support. */
function crimeChart(rows,w){
  w=w||420; var bh=24, gap=10, lw=132, pad=6, right=46;
  var plot=w-lw-right, h=rows.length*(bh+gap)-gap+pad*2+16;
  var s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img">';
  var x50=lw+plot*0.5;
  s+='<line x1="'+x50+'" y1="'+(pad-3)+'" x2="'+x50+'" y2="'+(h-18)+'" '+
     'stroke="#b9b9b2" stroke-width="1" stroke-dasharray="3 3"/>';
  s+='<text x="'+x50+'" y="'+(h-5)+'" font-size="10.5" fill="#7a7a72" '+
     'text-anchor="middle">national median</text>';
  rows.forEach(function(r,i){
    var y=pad+i*(bh+gap), v=Math.max(0,Math.min(100,r.v||0)), bw=plot*(v/100);
    s+='<text x="0" y="'+(y+bh*0.7)+'" font-size="12" fill="#44443e">'+esc(r.k)+'</text>';
    s+='<rect x="'+lw+'" y="'+y+'" width="'+plot+'" height="'+bh+
       '" rx="3" fill="#f0f0ea"/>';
    s+='<rect x="'+lw+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="#6a51a3"/>';
    s+='<text x="'+(lw+plot+6)+'" y="'+(y+bh*0.7)+'" font-size="12" '+
       'font-weight="600" fill="#1a1a18">'+Math.round(v)+'</text>';
  });
  return s+'</svg>';
}
function staticMap(lon,lat,style,zoom,pin,wide){
  var size=(wide?'640x300':'400x300')+'@2x';
  return 'https://api.mapbox.com/styles/v1/mapbox/'+style+'/static/pin-s+'+pin+
         '('+lon+','+lat+')/'+lon+','+lat+','+zoom+',0/'+size+'?access_token='+
         encodeURIComponent(TOKEN);
}
/* The parcel outline drawn over the aerial in white, and the frame fitted to
   the parcel rather than pinned to one zoom -- these sites run from 0.6 to 19
   acres, so no single zoom suits them. 'auto' sizes the view to the overlay;
   the padding keeps the boundary off the edge of the image.
   White alone, with no dark casing beneath it: a casing means a second copy of
   the geometry in the URL, and the longest outline here already encodes to
   4,136 characters against the Static API's 8,192-character URL limit. */
function boundaryMap(ring,lon,lat,wide){
  if(!ring) return null;
  var ov={type:'Feature',
          properties:{'stroke':'#ffffff','stroke-width':3,'stroke-opacity':1,
                      'fill':'#ffffff','fill-opacity':0},
          geometry:ring};
  var enc=encodeURIComponent(JSON.stringify(ov));
  var size=(wide?'640x300':'400x300')+'@2x';
  var url='https://api.mapbox.com/styles/v1/mapbox/satellite-v9/static/geojson('+
          enc+')/auto/'+size+'?padding=40&access_token='+encodeURIComponent(TOKEN);
  /* Over the limit would come back as an error image rather than a map, so fall
     back to the plain pinned aerial instead of showing a broken figure. */
  return url.length<=8000?url:null;
}

/* Orange County's 34 incorporated cities. Anything else the parcel claims as a
   city there -- Rancho Mission Viejo, Ladera Ranch, Coto de Caza, North Tustin
   -- is a community inside unincorporated county, not a jurisdiction. */
var OC_CITIES={'Aliso Viejo':1,'Anaheim':1,'Brea':1,'Buena Park':1,'Costa Mesa':1,
  'Cypress':1,'Dana Point':1,'Fountain Valley':1,'Fullerton':1,'Garden Grove':1,
  'Huntington Beach':1,'Irvine':1,'La Habra':1,'La Palma':1,'Laguna Beach':1,
  'Laguna Hills':1,'Laguna Niguel':1,'Laguna Woods':1,'Lake Forest':1,
  'Los Alamitos':1,'Mission Viejo':1,'Newport Beach':1,'Orange':1,'Placentia':1,
  'Rancho Santa Margarita':1,'San Clemente':1,'San Juan Capistrano':1,
  'Santa Ana':1,'Seal Beach':1,'Stanton':1,'Tustin':1,'Villa Park':1,
  'Westminster':1,'Yorba Linda':1};

/* Which authority actually governs land use here -- the first thing a developer
   needs, because everything else in this section is that body's to decide.

   Answered by point-in-polygon against the Census TIGER/Line places for
   California: inside an incorporated city or town, that city governs; inside a
   census designated place or outside every place, the county does, a CDP being
   a statistical area with no government of its own.

   The Assessor zoning tag is kept as a cross-check rather than the answer. It
   agreed on 489 of these 500 and the municipal boundary was right in all
   eleven exceptions -- including two Palmdale parcels whose situs city reads
   'Pearland', which is in Texas. Where the two still disagree the report says
   so, because a county zoning tag inside a city boundary usually means a
   recent annexation the Assessor string has not caught up with, and that is
   worth a developer's phone call rather than a silent decision here. */
function jurisdiction(r,x){
  var p=x&&x.place;
  if(p&&p.authority){
    var z=String(r.zoning||'').toUpperCase().replace(/[^A-Z0-9.]/g,'');
    var city=String(r.city||'').trim();
    var notes=[];
    if(!p.incorporated&&p.namelsad)
      notes.push('The site lies in '+esc(p.namelsad)+', a census designated '+
        'place — a statistical area, not a government. The county is the '+
        'land-use authority.');
    if(p.incorporated&&city&&city.toLowerCase()!==String(p.name||'').toLowerCase())
      notes.push('The parcel\'s recorded situs city reads '+esc(city)+
        ', which the municipal boundary does not bear out; the boundary governs.');
    // Only worth saying when the postal city is a different name from the CDP;
    // on Rancho Mission Viejo parcels the two are the same string and saying it
    // twice reads like a stutter.
    if(!p.incorporated&&city&&!/^unincorp/i.test(city)&&
       city.toLowerCase()!==String(p.name||'').toLowerCase())
      notes.push(esc(city)+' is the postal address, not the land-use authority.');
    if(r.co!=='OC'&&p.incorporated&&z.indexOf('LC')===0)
      notes.push('The Assessor zoning code begins LC, the unincorporated-county '+
        'tag, inside an incorporated boundary — usually a parcel annexed since '+
        'the zoning string was written. Confirm with '+esc(p.name)+'.');
    return {name:p.authority,note:notes.join(' ')||null};
  }
  return jurisdictionFallback(r);
}
/* Used only if the supporting data file predates the places lookup. */
function jurisdictionFallback(r){
  var z=String(r.zoning||'').toUpperCase().replace(/[^A-Z0-9.]/g,'');
  var city=String(r.city||'').trim();
  if(r.co==='OC'){
    if(city&&OC_CITIES[city]) return {name:'City of '+city};
    if(city) return {name:'Unincorporated Orange County',
      note:esc(city)+' is a community within the unincorporated county, not an incorporated city'};
    return {name:'Orange County — not determined',
      note:'no city recorded against this parcel'};
  }
  if(z.indexOf('LC')===0) return {name:'Unincorporated Los Angeles County',
    note:(city&&!/^unincorp/i.test(city))
      ? esc(city)+' is the postal address; the County, not that city, is the land-use authority':null};
  if(z.indexOf('LA')===0) return {name:'City of Los Angeles',
    note:(city&&city.toLowerCase()!=='los angeles')
      ? esc(city)+' is a district within the city':null};
  if(z) return {name:city?('City of '+city):'Incorporated city — name not recorded'};
  return {name:city?('City of '+city):'Not determined',
    note:'inferred from the situs city alone — this parcel carries no zoning code'};
}

/* "KG" and "06" are how TIGER writes the grade span. */
function gradeSpan(d){
  function g(v){ v=String(v||'').trim();
    return v==='KG'?'K':v.replace(/^0/,''); }
  if(!d||!d.lo||!d.hi) return '';
  return ' <span style="color:#7a7a72">(' + g(d.lo) + '–' + g(d.hi) + ')</span>';
}
function schoolsBlock(sch,near){
  var rows=[];
  if(sch&&sch.unified) rows.push(['Unified district',
    esc(sch.unified.name)+gradeSpan(sch.unified)]);
  if(sch&&sch.elementary) rows.push(['Elementary district',
    esc(sch.elementary.name)+gradeSpan(sch.elementary)]);
  if(sch&&sch.secondary) rows.push(['Secondary district',
    esc(sch.secondary.name)+gradeSpan(sch.secondary)]);
  var out='';
  if(rows.length) out+=tbl(rows);

  /* Nearest rated school of each level. Unrated schools are excluded from the
     search rather than shown with a blank: an unrated school displaces the
     nearest one that actually carries a rating, which is the thing being
     asked for. */
  var LV=[['elem','Elementary','#1b7f79'],['middle','Middle','#d4a017'],
          ['high','High','#c2185b']];
  var any=LV.some(function(l){ return near&&near[l[0]]; });
  if(any){
    var r2=[];
    LV.forEach(function(l){
      var n=near&&near[l[0]];
      if(!n) return;
      var bits='<b>'+esc(n.name||'')+'</b>';
      var tail=[];
      if(n.grade) tail.push('grade '+esc(n.grade));
      // "94.1th" -- these percentiles carry a decimal, so no ordinal suffix.
      if(n.pct!=null) tail.push('percentile '+esc(n.pct));
      if(n.rank&&n.rank_of) tail.push(num(n.rank)+' of '+num(n.rank_of)+
        ' '+l[1].toLowerCase()+' schools in California');
      if(tail.length) bits+='<div style="color:#44443e;font-size:12.5px;'+
        'margin-top:2px">'+tail.join(' · ')+'</div>';
      bits+='<div style="color:#7a7a72;font-size:12px">'+
        num(n.m)+' m away'+(n.district?' · '+esc(n.district):'')+'</div>';
      r2.push(['<span style="display:inline-block;width:9px;height:9px;'+
        'border-radius:50%;background:'+l[2]+';margin-right:6px"></span>'+
        l[1]+' school, nearest rated', bits]);
    });
    out+='<h4 style="font-size:13px;margin:16px 0 6px;font-weight:650">'+
         'Nearest rated schools</h4>'+tbl(r2);
  }
  if(!out) return '';
  return '<h3>Schools</h3>'+out+
    '<div class="note">Two things govern how these figures read. The state '+
    'ranks <b>within level</b> &mdash; 5,373 elementary, 1,193 middle and '+
    '1,045 high schools &mdash; so a position is among schools of that kind, '+
    'not among all of them. And 879 schools in these two counties carry no '+
    'rank at all; the source writes their percentile as 0, which would read as '+
    'the worst in California, so they are excluded from the search above rather '+
    'than shown as bottom-ranked.<br><br>'+
    'Distance is straight-line from the parcel centroid. A district boundary is '+
    'not an attendance area and neither is proximity: which school an address '+
    'actually feeds is set by the district and changes, and only the district '+
    'can confirm it.</div>';
}

/* ---------- neighbourhood narrative ----------------------------------------
   Written from the numbers in the row rather than about them: every clause
   below is a statement some field makes, and nothing is asserted that the data
   does not carry. Comparisons are against the other 499 sites in this
   assessment -- a benchmark the report actually holds -- rather than against a
   county or national median it does not. */
function pctileOf(vals,v){
  if(typeof v!=='number'||!vals.length) return null;
  var n=0; for(var i=0;i<vals.length;i++) if(vals[i]<v) n++;
  return Math.round(100*n/vals.length);
}
/* `positive` drops zeros from the comparison set. The block-group layer writes
   0 for "not reported" on the money fields -- 22 of these 500 carry a home
   value of 0 -- and leaving those in the distribution would both drag the
   benchmark down and let a site with no data be described as cheap. */
function peerVals(peers,f,positive){
  var out=[];
  for(var i=0;i<peers.length;i++){
    var v=peers[i]&&peers[i][f];
    if(typeof v==='number'&&isFinite(v)&&(!positive||v>0)) out.push(v);
  }
  return out;
}
function standing(p){
  if(p==null) return null;
  if(p>=90) return 'among the highest of the 500 sites assessed here';
  if(p>=75) return 'in the top quarter of the 500 sites assessed here';
  if(p>=60) return 'above the median of the sites assessed here';
  if(p>=40) return 'close to the median of the sites assessed here';
  if(p>=25) return 'below the median of the sites assessed here';
  return 'among the lowest of the 500 sites assessed here';
}

function narrative(r,b,tap,J,peers){
  var out=[];
  /* --- income and wealth --- */
  var s='';
  if(r.medinc!=null){
    s+='Median household income here is <b>'+usd(r.medinc)+'</b>';
    if(tap&&tap.income){
      var d=Math.round((r.medinc/tap.income-1)*100);
      s+=', '+(Math.abs(d)<5?'close to':(d>0?d+'% above':Math.abs(d)+'% below'))+
         ' the national figure for '+esc(tap.name)+' households ('+usd(tap.income)+')';
    }
    s+='. ';
  }
  if(b.wealth_mednw_cy){
    var pw=pctileOf(peerVals(peers,'wealth_mednw_cy',true),b.wealth_mednw_cy);
    s+='Median net worth stands at <b>'+usd(b.wealth_mednw_cy)+'</b>'+
       (standing(pw)?', '+standing(pw):'')+'. ';
  }
  if(b.Pct_Poverty!=null){
    s+=(b.Pct_Poverty<5?'Poverty is low at ':b.Pct_Poverty<12?'Poverty runs at ':
        'Poverty is elevated at ')+pct(b.Pct_Poverty)+'. ';
  }
  if(b.educationalattainment_BACHDEG_CY_P!=null){
    s+=pct(b.educationalattainment_BACHDEG_CY_P)+" of adults hold a bachelor's "+
       'degree or better.';
  }
  if(s) out.push(s);

  /* --- housing values --- */
  s='';
  if(!b.homevalue_AVGVAL_CY_1){
    // 0 means not reported, not worthless. Saying so beats an em-dash in a
    // sentence that then reasons about the number it does not have.
    s='The block-group data carries no average home value for this area, and '+
      'no five-year projection with it, so the local price level has to be '+
      'established from comparable sales rather than from this report.';
  } else {
    var pv=pctileOf(peerVals(peers,'homevalue_AVGVAL_CY_1',true),b.homevalue_AVGVAL_CY_1);
    s+='The average home in this block group is worth <b>'+usd(b.homevalue_AVGVAL_CY_1)+
       '</b>'+(standing(pv)?', '+standing(pv):'')+'. ';
    if(b.homevalue_AVGVAL_FY_1&&b.PCT_gain!=null){
      var up=b.homevalue_AVGVAL_FY_1>=b.homevalue_AVGVAL_CY_1;
      s+='The five-year projection carried in the block-group data puts it at <b>'+
         usd(b.homevalue_AVGVAL_FY_1)+'</b>, '+(up?'a gain':'a fall')+' of '+
         pct(Math.abs(b.PCT_gain))+
         (b.RE_GROWTH?' and characterised there as '+
            esc(String(b.RE_GROWTH).toLowerCase()):'')+'. ';
      var pg=pctileOf(peerVals(peers,'PCT_gain'),b.PCT_gain);
      if(pg!=null) s+='That rate of appreciation is '+standing(pg)+'. ';
    }
    s+='Values of this order set the floor for what new units must achieve to '+
       'justify construction, and the projection is a vendor estimate rather '+
       'than a forecast made here.';
  }
  if(s) out.push(s);

  /* --- who lives here --- */
  var g=[{k:'White',v:b.White_Pct},{k:'Hispanic',v:b.Hispanic_Pct},
         {k:'Asian',v:b.Asian_Pct},{k:'Black',v:b.Black_Pct}]
        .filter(function(x){return typeof x.v==='number';});
  if(g.length){
    g.sort(function(a,c){return c.v-a.v;});
    s='';
    if(g[0].v>=65) s+='Residents are predominantly '+g[0].k+' ('+pct(g[0].v)+')';
    else if(g[0].v>=50) s+='A majority of residents are '+g[0].k+' ('+pct(g[0].v)+')';
    else s+='The largest group is '+g[0].k+' at '+pct(g[0].v)+', short of a majority';
    var rest=g.slice(1).filter(function(x){return x.v>=1;})
                 .map(function(x){return x.k+' at '+pct(x.v);});
    if(rest.length) s+=', with '+(rest.length>1
      ? rest.slice(0,-1).join(', ')+' and '+rest[rest.length-1]
      : rest[0]);
    s+='. ';
    if(g[0].v<50) s+='No single group forms a majority, so the immediate '+
      'catchment is mixed. ';
    s+='These shares are reported independently of one another and Hispanic '+
       'origin overlaps the race categories, so they are not expected to total '+
       '100%. They are set out as market composition; nothing in this '+
       'assessment weighs them in a site\'s favour or against it.';
    out.push(s);
  }

  /* --- tenure --- */
  if(b.PCT_RENTER!=null){
    var pr=pctileOf(peerVals(peers,'PCT_RENTER'),b.PCT_RENTER);
    s='<b>'+pct(b.PCT_RENTER,0)+'</b> of occupied homes are rented and '+
      pct(b.PCT_OWNER,0)+' owner-occupied'+
      (standing(pr)?' — a renter share '+standing(pr):'')+'. ';
    s+=(b.PCT_RENTER>=65
        ? 'A renter share this high means the surrounding market already '+
          'functions as a rental one, and new units compete with existing '+
          'stock rather than having to create the habit.'
        : b.PCT_RENTER>=40
        ? 'That is a substantial renting population without the area being '+
          'dominated by it — the mix that usually supports new multifamily '+
          'without saturating it.'
        : 'This is a predominantly owner-occupied area, so new rental units '+
          'would be entering a market that is not primarily a renting one; '+
          'that is a demand question to test before committing.');
    if(b.VacancyRate!=null){
      var pvac=pctileOf(peerVals(peers,'VacancyRate'),b.VacancyRate);
      s+=' Vacancy runs at '+pct(b.VacancyRate,0)+
         (pvac!=null&&pvac<=25?', tight against the other sites assessed':
          pvac!=null&&pvac>=75?', loose against the other sites assessed':'')+'.';
    }
    out.push(s);
  }

  /* --- the place itself --- */
  s='';
  var where=J&&J.name?J.name:(r.city||'this area');
  if(b.DENSITY!=null){
    s+='The site sits in '+esc(where)+' at '+num(b.DENSITY)+' people per square '+
       'mile'+(b.DENSITY_DESC?', '+esc(String(b.DENSITY_DESC).toLowerCase()):'')+
       ' for the block group';
    if(b.pop1mile!=null) s+=', with '+num(b.pop1mile)+' people within a mile and '+
      num(b.pop3mile)+' within three';
    s+='. ';
  }
  if(b.PopInc_comment){
    // The source string already starts "POPULATION ...", and already carries
    // its own bracketed range, so neither is repeated around it.
    var trend=String(b.PopInc_comment).toLowerCase().replace(/^population\s+/,'');
    s+='Population is '+esc(trend)+
       (b.PctPopIncrease2227!=null?', '+pct(b.PctPopIncrease2227)+' projected':'')+'. ';
  }
  if(b.F5yearincrements_medage_cy!=null){
    var pa=pctileOf(peerVals(peers,'F5yearincrements_medage_cy'),b.F5yearincrements_medage_cy);
    s+='Median age is '+b.F5yearincrements_medage_cy+
       (pa!=null&&pa<=25?', young against the other sites assessed':
        pa!=null&&pa>=75?', older than most of the sites assessed':'')+
       (b.AverageHouseholdSize?', and households average '+b.AverageHouseholdSize+
        ' people':'')+'. ';
  }
  if(r.transit_m!=null) s+=(r.transit_m<400?'A transit stop is '+num(r.transit_m)+
      ' m away, within an easy walk':r.transit_m<800?'The nearest transit stop is '+
      num(r.transit_m)+' m away':'The nearest transit stop is '+num(r.transit_m)+
      ' m away, beyond a comfortable walk')+'. ';
  if(b.TOTALCRIMEPERCENTILE!=null) s+='The block group indexes at '+
    Math.round(b.TOTALCRIMEPERCENTILE)+' on the total crime percentile, where 100 '+
    'is the national maximum'+
    (b.PROPERTYCRIMEPERCENTILE!=null?' ('+Math.round(b.PROPERTYCRIMEPERCENTILE)+
      ' for property crime, '+Math.round(b.PERSONALCRIMEPERCENTILE)+' personal)':'')+'. ';
  if(r.mf_near) s+=num(r.mf_near)+' other parcels meeting the same multifamily '+
    'criteria lie within 300 m, so this is not an isolated opportunity.';
  if(s) out.push(s);
  return out;
}

/* ---------- interpretation helpers (rule-based, never invented) ---------- */
function geoNote(code){
  var fam=(typeof GEO_FAMILY!=='undefined'&&GEO_FAMILY[code])||null;
  var q=/^Q/.test(code||'');
  return {fam:fam,
    read: q ? 'Unconsolidated to weakly consolidated Quaternary sediment. '+
              'Typical of basin-floor sites: adequate bearing for low- and '+
              'mid-rise construction once compacted or over-excavated, but it '+
              'is also the setting where liquefaction and differential '+
              'settlement arise, so a geotechnical investigation governs '+
              'foundation type.'
            : 'Pre-Quaternary bedrock or semi-consolidated unit. Generally '+
              'stronger bearing than basin sediment, with excavation cost and '+
              'rippability, not bearing capacity, usually the governing issue '+
              'for a four-storey structure.'};
}
function gwNote(g){
  if(!g||g.depth_ft==null) return null;
  var d=g.depth_ft, far=g.dist_m>1000;
  var t;
  if(d<=10) t='Very shallow. Expect dewatering for any below-grade work and '+
    'treat liquefaction potential as live.';
  else if(d<=30) t='Shallow. Subterranean parking or a basement would likely '+
    'require dewatering and a waterproofing design.';
  else if(d<=50) t='Moderate. A single below-grade level is usually feasible '+
    'without permanent dewatering.';
  else t='Deep. Groundwater is unlikely to govern foundation or excavation design.';
  return t+(far?' Note the nearest contour is '+num(g.dist_m)+' m away, so this '+
    'is a regional reading rather than a site measurement.':'');
}

<script>
/* ---------- build ---------- */
function qs(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);
  return m?decodeURIComponent(m[1]):null;}

Promise.all([
  fetch('./multifamily.json').then(function(r){return r.json();}),
  fetch('./mf_report.json').then(function(r){return r.json();}).catch(function(){return {};}),
  fetch('./tapestry.json').then(function(r){return r.json();}).catch(function(){return [];})
]).then(function(a){ render(a[0],a[1],a[2]); })
 .catch(function(e){
   document.getElementById('out').innerHTML='<div class="err">Could not load the '+
     'report data.<br><small>'+esc(e&&e.message)+'</small></div>';});

function render(mf,extra,taps){
  var rank=qs('rank'), apn=qs('apn'), rows=mf.rows||[];

  // 7642 Warner Ave in Huntington Beach carried the block group, geology and

      esc(x.apn)+', but that rank now holds APN '+esc(r.apn)+' ('+
      esc(r.addr||'')+').<br><br>'+
      'The shortlist has been re-scored since the supporting data was built, '+
      'so the two are keyed to different rankings. Re-run '+
      '<code>tools/mf_report_data.py</code> against the current list.'+
      '</div>';

  }

  // site in this assessment -- the only benchmark this report actually holds.
  var J=jurisdiction(r,x);
  var peers=[];
  for(var pk in extra){ if(extra[pk]&&extra[pk].block) peers.push(extra[pk].block); }
  var tap=null, tn=(r.tapestry||'').trim().toLowerCase();

  var H=[];

    '</div>'+
    '<div class="eyebrow">Multifamily Development Site Report</div>'+
    '<h1>'+esc(r.addr||('APN '+r.apn))+'</h1>'+
    '<div class="sub">'+esc(r.city||'')+(r.zip?' '+esc(r.zip):'')+
      ' · '+(r.co==='OC'?'Orange County':'Los Angeles County')+
      ' · APN '+esc(r.apn)+'</div>'+
    '<div class="badges">'+
      badge('Rank','#'+r.rank,'of '+(mf.scored!=null?num(mf.scored):'')+' scored')+
      badge('Score',(r.score!=null?r.score:'—'),'of '+(mf.max_score||90))+
      badge('Site area',(r.acres!=null?r.acres:'—'),'acres')+
      badge('Capacity',num(r.cap_units),'units at '+num(r.du_acre)+'/ac')+
      badge('Land value',usd(r.land),'assessor')+
    '</div></header>');

  /* ===== 1. neighbourhood ===== */
  var S=['<section><h2>1 · Neighborhood</h2>'];
  if(tap){
    S.push('<h3>Market segment: '+esc(tap.name)+
      (tap.code?' <span style="color:#7a7a72;font-weight:400">('+esc(tap.code)+')</span>':'')+'</h3>');
    S.push('<p class="lede">'+esc(tap.desc||'')+'</p>');
    var tb=[];
    if(tap.lifemode) tb.push(['LifeMode group',esc(tap.lifemode)]);
    if(tap.urban) tb.push(['Urbanization',esc(tap.urban)]);
    if(tap.conc) tb.push(['Where it concentrates',esc(tap.conc)]);

  } else if(r.tapestry){
    S.push('<h3>Market segment: '+esc(r.tapestry)+'</h3>');

  var narr=narrative(r,b,tap,J,peers);

    S.push('<h3>This neighborhood in particular</h3>');
    narr.forEach(function(para){ S.push('<p>'+para+'</p>'); });
  }

  S.push('<h3>The numbers</h3>');
  var nb=[];
  nb.push(['Median household income',usd(r.medinc)]);
  nb.push(['Median net worth',usd(b.wealth_mednw_cy)]);
  nb.push(['Average home value, current',usd(b.homevalue_AVGVAL_CY_1)]);
  nb.push(['Average home value, 5-year estimate',usd(b.homevalue_AVGVAL_FY_1)]);
  if(b.PCT_gain!=null) nb.push(['Implied 5-year change',pct(b.PCT_gain)+
    (b.RE_GROWTH?' · '+esc(b.RE_GROWTH).toLowerCase():'')]);
  nb.push(['Median age',b.F5yearincrements_medage_cy!=null?b.F5yearincrements_medage_cy:'—']);
  nb.push(['Households',num(b.TotalHouseholds)]);
  nb.push(['Housing units',num(b.TotalHousingUnits)+

  nb.push(['Population within 1 mile',num(b.pop1mile)]);
  nb.push(['Population within 3 / 5 miles',num(b.pop3mile)+' / '+num(b.pop5mile)]);
  nb.push(['Block-group density',(b.DENSITY!=null?num(b.DENSITY)+'/sq mi':'—')+
    (b.DENSITY_DESC?' · '+esc(String(b.DENSITY_DESC).toLowerCase()):'')]);
  // Same doubling the narrative already avoids: the source string begins
  // "POPULATION ...", so the label must not repeat it.
  if(b.PopInc_comment) nb.push(['Population trend',
    esc(String(b.PopInc_comment).toLowerCase().replace(/^population\s+/,''))]);
  if(b.educationalattainment_BACHDEG_CY_P!=null)
    nb.push(["Bachelor's degree or higher",pct(b.educationalattainment_BACHDEG_CY_P)]);
  if(b.Pct_Poverty!=null) nb.push(['Poverty rate',pct(b.Pct_Poverty)]);
  if(b.TOTALCRIMEPERCENTILE!=null){
    nb.push(['Crime percentile, total',Math.round(b.TOTALCRIMEPERCENTILE)+

    nb.push(['Crime percentile, personal / property',
      Math.round(b.PERSONALCRIMEPERCENTILE)+' / '+
      Math.round(b.PROPERTYCRIMEPERCENTILE)]);
  }
  S.push('<div class="kv">'+tbl(nb.slice(0,Math.ceil(nb.length/2)))+
         tbl(nb.slice(Math.ceil(nb.length/2)))+'</div>');

  if(b.White_Pct!=null){
    S.push('<figure>'+barChart([
      {k:'White',v:+b.White_Pct,lbl:pct(b.White_Pct),c:'#6a51a3'},
      {k:'Hispanic',v:+b.Hispanic_Pct,lbl:pct(b.Hispanic_Pct),c:'#807dba'},
      {k:'Asian',v:+b.Asian_Pct,lbl:pct(b.Asian_Pct),c:'#9e9ac8'},
      {k:'Black',v:+b.Black_Pct,lbl:pct(b.Black_Pct),c:'#bcbddc'}
    ],{max:100,lw:90})+
    '<figcaption><b>Figure 1.</b> Population by race and ethnicity, '+
    'census block group '+esc(b.GEOID||'')+'. Shares are reported independently '+
    'and Hispanic origin overlaps the race categories, so the bars are not '+
    'expected to total 100%.</figcaption></figure>');
  }
  if(b.PCT_OWNER!=null){
    S.push('<figure>'+stackBar([
      {k:'Owner-occupied',v:+b.PCT_OWNER,c:'#2d6a5a'},
      {k:'Renter-occupied',v:+b.PCT_RENTER,c:'#6a51a3'}
    ])+'<figcaption><b>Figure 2.</b> Tenure split. A renter share of '+

  if(b.homevalue_AVGVAL_CY_1!=null&&b.homevalue_AVGVAL_FY_1!=null){
    S.push('<figure>'+barChart([
      {k:'Current',v:+b.homevalue_AVGVAL_CY_1,lbl:usd(b.homevalue_AVGVAL_CY_1),c:'#54278f'},

    (b.RE_ASSESS_2022_2027?' ("'+esc(String(b.RE_ASSESS_2022_2027).toLowerCase())+'")':'')+

  if(b.TOTALCRIMEPERCENTILE!=null){
    var pc=pctileOf(peerVals(peers,'TOTALCRIMEPERCENTILE'),b.TOTALCRIMEPERCENTILE);

  S.push(schoolsBlock(x.schools, x.near_schools));
  S.push('</section>');

  /* ===== 2. property ===== */

  var bmap=boundaryMap(x.ring,r.lon,r.lat), outlined=!!bmap;
  S.push('<figure class="two">'+

    '</figure><figcaption style="margin-top:-12px"><b>Figure 5.</b> Left: '+
    (outlined

      : 'the parcel at '+esc(r.addr||r.apn)+' in aerial view at zoom 17.')+
    ' Right: the same point at zoom 13 for neighbourhood context, pinned at the '+
    'parcel centroid — which on an irregular lot need not fall inside the '+

  var pb=[];
  pb.push(['Lot area',num(r.area)+' sq ft · '+(r.acres!=null?r.acres+' acres':'')]);
  pb.push(['Dimensions',ft(r.w_ft)+' × '+ft(r.d_ft)+

  pb.push(['Year built',r.yr?r.yr:'no building of record']);

  pb.push(['Assessed land',usd(r.land)]);
  pb.push(['Assessed improvements',usd(r.impr)]);

  pb.push(['APNs in this site',num(r.apn_n)+(r.grouped?' · '+r.grouped+' adjoining parcel(s) folded in':'')]);
  pb.push(['Transit, nearest stop',r.transit_m!=null?num(r.transit_m)+' m':'—']);
  S.push(tbl(pb));

  S.push('<h3>Suitability metrics</h3>');
  var cats=[
    {k:'Redevelopment potential',v:r.c_redevelopment,m:30},

  ];
  S.push('<figure>'+barChart(cats.map(function(c){

              c:'#2d6a5a'};}),{max:100,lw:160})+
    '<figcaption><b>Figure 6.</b> Score by category, each drawn as a share of '+

    'Total '+(r.score!=null?r.score:'—')+' of '+(mf.max_score||90)+

  if(r.why) S.push('<p><b>Why it scores where it does.</b> '+esc(r.why)+'</p>');

  S.push('<h3>Obstacles to development</h3>');

  if(r.c_constraints!=null&&r.c_constraints<5) obs.push('The constraints category '+

  if(r.w_ft!=null&&r.w_ft<75) obs.push('Lot width of '+ft(r.w_ft)+' is below the '+

  if(r.gp_src==='spatial') obs.push('The general plan designation was matched to '+

  if(!obs.length) obs.push('No hazard designation, shape penalty or standing '+
    'improvement of significance was recorded against this parcel.');
  S.push('<ul>'+obs.map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul>');
  S.push('</section>');

  /* ===== 3. land use, zoning, surroundings, government ===== */
  S.push('<section><h2>3 · Land Use, Zoning and Jurisdiction</h2>');
  var lu=[];
  lu.push(['Jurisdiction','<b>'+esc(J.name)+'</b>'+
    (J.note?'<div style="color:#7a7a72;font-size:12px;margin-top:2px">'+J.note+'</div>':'')]);
  lu.push(['SCAG general plan',esc(r.gp_lbl||'—')+(r.gp?' ('+esc(r.gp)+')':'')]);

  lu.push(['Permitted density',r.du_acre!=null?num(r.du_acre)+' du/acre':'—']);
  lu.push(['Implied capacity',num(r.cap_units)+' units']);
  lu.push(['Specific plan',r.sp?esc(r.sp):'none recorded']);
  lu.push(['Pathway tier',r.tier==='mf'?'multifamily by right':'conversion pathway']);
  S.push(tbl(lu));
  S.push('<div class="note">Jurisdiction is established by the parcel centroid '+
    'against the Census TIGER/Line municipal boundaries for California, not by '+
    'the mailing address: inside an incorporated city or town that city '+
    'governs, and inside a census designated place — or outside every place — '+
    'the county does. The Assessor zoning tag is used only to cross-check it.'+
    '<br><br>Zoning itself is read two ways on purpose. '+
    '<b>'+esc(r.zoning||'—')+'</b> is the Assessor\'s string, which is the '+
    "jurisdiction's own vocabulary — city code for an incorporated parcel, county "+
    'code for unincorporated land. <b>'+esc(r.zn||'—')+'</b> is SCAG\'s '+
    'normalisation of the same thing onto one scheme across all 89 jurisdictions, '+
    'which is what makes parcels comparable. Where they disagree, the '+
    "jurisdiction's own code governs.</div>");

  S.push('<h3>Expansion onto surrounding parcels</h3>');
  var ex=[];
  ex.push(['Adjoining parcels in common ownership',num(r.asm_n)]);
  ex.push(['Additional area available that way',r.asm_sqft?num(r.asm_sqft)+' sq ft':'—']);
  ex.push(['Candidate parcels within 300 m',num(r.mf_near)]);
  S.push(tbl(ex));
  S.push('<p>'+(r.asm_n>0
    ? 'This site adjoins '+num(r.asm_n)+' parcel(s) held by the same owner, '+
      'adding '+num(r.asm_sqft)+' sq ft if assembled — the cheapest form of '+
      'expansion, since it needs one negotiation rather than several.'
    : 'No adjoining parcel is held by the same owner, so assembly here means '+
      'separate negotiations.')+
    (r.mf_near>0?' '+num(r.mf_near)+' other parcel(s) meeting the same '+
      'multifamily criteria lie within 300 m, which indicates how far a larger '+
      'programme could extend.':'')+'</p>');

  S.push('<h3>Local government and other agencies</h3>');
  S.push('<div class="gap"><b>Not covered by this dataset.</b> The criteria ask '+
    "for the local government's stance on new development and for other agencies "+
    'that must be consulted. Neither is a mapped quantity, and nothing in the '+
    'layers behind this report expresses them, so no assessment is offered here '+
    'rather than one being inferred. For '+esc(r.city||'this jurisdiction')+
    ', the items to establish directly are: the current Housing Element and its '+
    'RHNA allocation; any inclusionary or density-bonus ordinance; design review '+
    'and CEQA posture on infill; and, where applicable, review by the regional '+
    'water board, air district, Caltrans for state-highway access, or the Coastal '+
    'Commission. Treat the capacity figure above as a zoning entitlement ceiling, '+
    'not as a political forecast.</div>');
  S.push('</section>');

  /* ===== 4. hazards ===== */
  S.push('<section><h2>4 · Hazards and Environmental Constraints</h2>');
  var flags=(r.flags||'').toLowerCase(), miss=(r.missing||'').toLowerCase();
  function hz(name,test,detail,checked){
    var on=test, unknown=!checked;
    return '<div class="hz"><span class="dot '+(unknown?'unk':on?'bad':'ok')+'"></span>'+
      '<span class="nm">'+esc(name)+'</span><span class="dt">'+
      (unknown?'not evaluated — '+esc(detail||''):on?esc(detail||'within a mapped zone')
        :'no mapped zone at this location')+'</span></div>';
  }
  var hzs='';
  hzs+=hz('Alquist-Priolo fault zone',/alquist|fault zone/.test(flags),
          flags.match(/alquist[^;]*/)?RegExp.lastMatch:'within an A-P zone',
          miss.indexOf('ap')<0);
  hzs+=hz('Dam inundation',/dam inundation/.test(flags),
          (flags.match(/dam inundation[^;]*/)||[''])[0],miss.indexOf('dam')<0);
  hzs+=hz('FEMA flood zone',/flood/.test(flags),
          (flags.match(/fema flood[^;]*/)||[''])[0],miss.indexOf('flood')<0);
  hzs+=hz('Liquefaction',/liquefaction/.test(flags),'within a liquefaction zone',
          miss.indexOf('liq')<0);
  hzs+=hz('Tsunami inundation',!!x.tsunami,
          x.tsunami?('mapped zone'+(x.tsunami.county?' · '+esc(x.tsunami.county):'')):'',
          x.tsunami!==undefined);
  hzs+=hz('Earthquake-induced landslide',/landslide/.test(flags),
          'within a seismic landslide zone',miss.indexOf('slide')<0);
  hzs+=hz('Fire hazard severity',/fire hazard/.test(flags),
          (flags.match(/[a-z ]*fire hazard[^;]*/)||[''])[0],miss.indexOf('fire')<0);
  hzs+=hz('USFWS critical habitat',!!x.habitat,
          x.habitat?('designated for '+esc(x.habitat.sp||x.habitat.sci||'a listed species')):'',
          x.habitat!==undefined);
  S.push(hzs);
  S.push('<figcaption style="margin-top:12px"><b>Table 1.</b> Each layer '+
    'point-tested at the parcel centroid. Green is a tested negative, not an '+
    'untested one. A zone boundary can cross a large parcel, so a negative at '+
    'the centroid does not clear the whole site.</figcaption>');
  S.push('</section>');

  /* ===== 5. geology ===== */
  S.push('<section><h2>5 · Geologic Suitability to Four Storeys</h2>');
  var gcode=(x.geology||{}).PTYPE, gn=geoNote(gcode), soil=x.soil||{}, slope=x.slope;
  var gl=[];
  gl.push(['Geologic unit',gcode?esc(gcode)+(gn.fam?' — '+esc(gn.fam):''):'—']);
  gl.push(['Soil order',soil.o?esc(soil.o):'—']);
  gl.push(['Soil map unit',soil.n?esc(soil.n):'—']);
  gl.push(['Slope class',slope?(slope.low_pct===slope.high_pct
        ?slope.high_pct+'%':slope.low_pct+'–'+slope.high_pct+'%')+
        ' (from the soil map unit)':'not stated by the soil map unit']);
  gl.push(['Depth to groundwater',(x.gw&&x.gw.depth_ft!=null)
        ?(x.gw.depth_ft+' ft, nearest contour '+num(x.gw.dist_m)+' m away'):'—']);
  S.push(tbl(gl));
  if(gcode) S.push('<p><b>Bearing and foundations.</b> '+gn.read+'</p>');
  var gwn=gwNote(x.gw);
  if(gwn) S.push('<p><b>Groundwater.</b> '+gwn+'</p>');
  if(slope) S.push('<p><b>Slope.</b> The SSURGO map unit states '+
    (slope.low_pct===slope.high_pct?slope.high_pct+'%':slope.low_pct+'–'+slope.high_pct+'%')+
    '. That is a property of a map unit covering tens of acres, not a measured '+
    'gradient across this parcel, so a flat class does not rule out a steep '+
    'corner. No parcel-scale terrain model exists in this dataset.</p>');
  if(/liquefaction/.test(flags)&&/^Q/.test(gcode||''))
    S.push('<div class="note"><b>Read these two together.</b> A Quaternary '+
      'sedimentary unit inside a mapped liquefaction zone is the combination '+
      'that drives ground-improvement or deep-foundation cost. For four '+
      'storeys this is routinely engineered, but it belongs in the pro forma '+
      'from the outset rather than arriving with the soils report.</div>');
  S.push('</section>');

  /* ===== 6. summary ===== */
  S.push('<section><h2>6 · Summary of Development Suitability</h2>');
  var pos=[],neg=[];
  if(r.score!=null&&mf.max_score) pos.push('scores '+r.score+' of '+mf.max_score+
    ', ranking #'+r.rank+' of '+num(mf.scored)+' parcels assessed');
  if(r.cap_units) pos.push('zoning supports roughly '+num(r.cap_units)+' units at '+
    num(r.du_acre)+' du/acre');
  if(r.vacant) pos.push('the lot carries no building of record, so there is no '+
    'demolition or tenant relocation');
  if(r.transit_m!=null&&r.transit_m<800) pos.push('a transit stop lies '+
    num(r.transit_m)+' m away');
  if(b.PCT_RENTER!=null&&+b.PCT_RENTER>40) pos.push('renters are already '+
    pct(b.PCT_RENTER,0)+' of the block group');
  if(r.asm_n>0) pos.push(num(r.asm_n)+' adjoining parcel(s) in the same ownership '+
    'offer expansion without a second counterparty');
  if(r.reg!=null&&r.reg>0.9) pos.push('the lot is close to rectangular '+
    '(regularity '+(+r.reg).toFixed(2)+')');
  if(r.flags) neg.push('hazard designations: '+esc(r.flags));
  if(x.gw&&x.gw.depth_ft!=null&&x.gw.depth_ft<=30) neg.push('groundwater at '+
    x.gw.depth_ft+' ft complicates below-grade construction');
  if(r.w_ft!=null&&r.w_ft<75) neg.push('lot width '+ft(r.w_ft)+' is below the preferred 75 ft');
  if(r.tier!=='mf') neg.push('housing is a conversion pathway here rather than '+
    'permitted by right');
  if(r.missing) neg.push('some criteria could not be evaluated: '+esc(r.missing));
  neg.push("the jurisdiction's political posture and the agency review path are "+
    'outside this dataset and remain to be established');
  S.push('<h3>In favour</h3><ul>'+pos.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul>');
  S.push('<h3>Against, or to be resolved</h3><ul>'+neg.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul>');
  S.push('<div class="note">This report assembles mapped and assessor data. It '+
    'is a screening instrument: it narrows a two-county parcel fabric to sites '+
    'worth a site visit, a title search and a geotechnical scope. It is not an '+
    'appraisal, a feasibility study, or entitlement advice, and no figure here '+
    'has been verified against a jurisdiction\'s own records.</div>');
  S.push('</section>');

  var now=new Date().toISOString().slice(0,10);
  S.push('<footer>Generated '+now+' from the Geonomics multifamily siting '+
    'assessment · scoring per Multifamily_Criteria.docx, reported out of '+
    (mf.max_score||90)+' · parcel and roll data from the LA County and Orange '+
    'County assessors · demographics from census block groups · hazards from CGS, '+
    'FEMA, DSOD, CAL FIRE and USFWS · geology CGS, soils SSURGO, groundwater DWR.'+
    '<br>Centroid '+(+r.lat).toFixed(6)+', '+(+r.lon).toFixed(6)+
    ' · <a href="./">back to the map</a></footer>');

  document.getElementById('out').innerHTML=H.join('')+S.join('');
  document.title=(r.addr||('APN '+r.apn))+' — Multifamily Site Report';
  // The browser's own print path, not a PDF library: every browser offers
  // "Save as PDF" as a print destination, it honours the @page and @media
  // print rules above, and it keeps the text selectable and the figures as
  // vectors. A client-side PDF library would rasterise the SVG charts and add
  // a megabyte of script to do worse.
  var pb=document.getElementById('pdf-btn');
  if(pb) pb.addEventListener('click',function(){ window.print(); });
}
function badge(k,v,s){return '<div class="badge"><div class="k">'+esc(k)+
  '</div><div class="v">'+esc(v)+(s?' <small>'+esc(s)+'</small>':'')+'</div></div>';}
function tbl(rows){return '<table>'+rows.map(function(r){
  return '<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>';}).join('')+'</table>';}
</script>
